<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1060" viewBox="0 0 1680 1060" role="img" aria-labelledby="title description">
  <title id="title">Editor de designs de carteirinha do IEPRCard</title>
  <desc id="description">Proposta responsiva do editor de layouts, com classificação de fundos, rasterização local da primeira página de PDFs e uso de campos dinâmicos para dados pessoais.</desc>
