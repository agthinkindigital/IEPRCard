<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1980" viewBox="0 0 1440 1980" role="img" aria-labelledby="title description">
  <title id="title">Administração global de Sedes, empresas e acessos</title>
  <desc id="description">Painel global Master para gerenciar planos de clientes, Sedes, empresas/unidades e usuários, com provisionamento direto ou convite para criar uma única Sede.</desc>
  <rect width="1440" height="1000" fill="#F6F8FB"/><rect width="248" height="1000" fill="#FFFFFF"/><path d="M248 0v1000" stroke="#DCE3EC"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="24" y="23" width="36" height="36" rx="9" fill="#1D4ED8"/><path d="M34 33h16v16H34z" fill="none" stroke="#fff" stroke-width="2"/><text x="72" y="47" font-size="18" font-weight="700" fill="#0F172A">IEPRCard</text>
    <text x="24" y="100" font-size="11" font-weight="700" fill="#64748B">ADMINISTRAÇÃO GLOBAL</text><text x="24" y="126" font-size="14" font-weight="600" fill="#0F172A">Superadmin</text><path d="M24 148h200" stroke="#DCE3EC"/>
    <rect x="12" y="166" width="224" height="42" rx="8" fill="#EFF6FF"/><text x="30" y="192" font-size="14" font-weight="600" fill="#1D4ED8">Sedes e acessos</text><text x="30" y="241" font-size="14" fill="#475569">Planos de clientes</text><text x="30" y="289" font-size="14" fill="#475569">Perfil da instalação</text><text x="30" y="337" font-size="14" fill="#475569">Eventos técnicos</text><text x="30" y="385" font-size="14" fill="#475569">Backups</text>
    <rect x="248" y="0" width="1192" height="70" fill="#fff"/><path d="M248 70h1192" stroke="#DCE3EC"/><text x="280" y="42" font-size="13" fill="#64748B">Painel global /</text><text x="376" y="42" font-size="13" font-weight="600" fill="#0F172A">Sedes e acessos</text>
    <text x="280" y="126" font-size="30" font-weight="700" fill="#0F172A">Sedes e acessos</text><text x="280" y="155" font-size="14" fill="#475569">Gerencie planos de clientes, Sedes, empresas e usuários.</text>
    <rect x="1125" y="98" width="253" height="46" rx="8" fill="#1D4ED8"/><text x="1252" y="127" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">+ Cadastrar Sede</text>
    <rect x="280" y="181" width="1098" height="90" rx="10" fill="#fff" stroke="#DCE3EC"/><text x="305" y="213" font-size="12" font-weight="600" fill="#475569">SEDES CADASTRADAS</text><text x="305" y="249" font-size="24" font-weight="700" fill="#0F172A">12</text><text x="535" y="213" font-size="12" font-weight="600" fill="#475569">ATIVAS</text><text x="535" y="249" font-size="24" font-weight="700" fill="#166534">9</text><text x="765" y="213" font-size="12" font-weight="600" fill="#475569">AGUARDANDO ATIVAÇÃO</text><text x="765" y="249" font-size="24" font-weight="700" fill="#92400E">3</text><path d="M495 197v56M725 197v56" stroke="#E2E8F0"/>
    <rect x="280" y="293" width="1098" height="52" rx="8" fill="#fff" stroke="#DCE3EC"/><text x="300" y="325" font-size="13" fill="#64748B">Buscar organização ou responsável</text><rect x="1190" y="304" width="168" height="30" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/><text x="1207" y="324" font-size="12" fill="#334155">Todos os estados ▾</text>
    <rect x="280" y="362" width="1098" height="425" rx="10" fill="#fff" stroke="#DCE3EC"/><path d="M280 410h1098" stroke="#DCE3EC"/><text x="303" y="393" font-size="12" font-weight="700" fill="#64748B">ORGANIZAÇÃO</text><text x="610" y="393" font-size="12" font-weight="700" fill="#64748B">RESPONSÁVEL</text><text x="830" y="393" font-size="12" font-weight="700" fill="#64748B">ENDEREÇO</text><text x="1085" y="393" font-size="12" font-weight="700" fill="#64748B">ESTADO</text><text x="1265" y="393" font-size="12" font-weight="700" fill="#64748B">AÇÃO</text>
    <g font-size="13" fill="#0F172A"><text x="303" y="450">Instituto Exemplo</text><text x="610" y="450">Ana Silva</text><text x="830" y="450">instituto.exemplo.com.br</text><text x="1085" y="450" fill="#166534">Ativa</text><text x="1265" y="450" fill="#1D4ED8">Detalhes</text><text x="303" y="505">Comunidade do Vale</text><text x="610" y="505">Marcos Costa</text><text x="830" y="505">vale.ieprcard.local</text><text x="1085" y="505" fill="#92400E">Pendente</text><text x="1265" y="505" fill="#1D4ED8">Detalhes</text></g><path d="M280 472h1098M280 527h1098" stroke="#EEF2F6"/>
    <rect x="280" y="821" width="1098" height="104" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/><text x="305" y="856" font-size="14" font-weight="700" fill="#1E3A8A">Master é o papel global do superadmin</text><text x="305" y="883" font-size="13" fill="#334155">A conta Master não recebe plano de cliente. Cada Sede usa um plano próprio; todas as criações globais respeitam as cotas da Sede.</text><text x="305" y="904" font-size="13" fill="#334155">Sede e unidade também podem criar acessos dentro do limite do plano e das permissões delegadas.</text>
    <rect x="782" y="108" width="596" height="760" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="814" y="151" font-size="21" font-weight="700" fill="#0F172A">Provisionar Sede</text><text x="814" y="178" font-size="13" fill="#64748B">Escolha criar a Sede agora ou convidar quem a criará no primeiro acesso.</text><path d="M782 194h596" stroke="#E2E8F0"/>
    <text x="814" y="218" font-size="12" font-weight="600" fill="#334155">Forma de provisionamento</text><rect x="814" y="229" width="258" height="38" rx="7" fill="#EFF6FF" stroke="#1D4ED8"/><text x="943" y="253" text-anchor="middle" font-size="12" font-weight="600" fill="#1D4ED8">Criar Sede e responsável</text><rect x="1088" y="229" width="258" height="38" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1217" y="253" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Convidar para criar a Sede</text><text x="814" y="282" font-size="12" font-weight="600" fill="#334155">Nome da organização</text><rect x="814" y="294" width="532" height="42" rx="7" fill="#fff" stroke="#CBD5E1"/><text x="830" y="320" font-size="13" fill="#94A3B8">Ex.: Instituto Exemplo</text>
    <text x="814" y="367" font-size="12" font-weight="600" fill="#334155">Nome do responsável da Sede</text><rect x="814" y="379" width="532" height="42" rx="7" fill="#fff" stroke="#CBD5E1"/><text x="830" y="405" font-size="13" fill="#94A3B8">Nome completo</text>
    <text x="814" y="452" font-size="12" font-weight="600" fill="#334155">E-mail de acesso</text><rect x="814" y="464" width="532" height="42" rx="7" fill="#fff" stroke="#CBD5E1"/><text x="830" y="490" font-size="13" fill="#94A3B8">responsavel@instituicao.org</text>
    <text x="814" y="537" font-size="12" font-weight="600" fill="#334155">Senha inicial do responsável (mínimo de 12 caracteres)</text><rect x="814" y="549" width="532" height="42" rx="7" fill="#fff" stroke="#CBD5E1"/><text x="830" y="575" font-size="13" fill="#94A3B8">Defina com o responsável por canal seguro</text>
    <text x="814" y="622" font-size="12" font-weight="600" fill="#334155">Plano da Sede</text><rect x="814" y="634" width="532" height="42" rx="7" fill="#F8FAFC" stroke="#CBD5E1"/><text x="830" y="660" font-size="13" fill="#0F172A">Selecione um plano ativo de cliente ▾</text>
    <text x="814" y="707" font-size="12" font-weight="600" fill="#334155">Cotas iniciais (unidades, equipe, titulares, emissões)</text><rect x="814" y="719" width="532" height="42" rx="7" fill="#fff" stroke="#CBD5E1"/><text x="830" y="745" font-size="13" fill="#0F172A">Valores definidos conforme o plano da Sede</text>
    <text x="814" y="787" font-size="12" fill="#64748B">Sem plano ativo, crie/configure um primeiro no painel Planos. A conta Master não usa plano.</text>
    <rect x="1088" y="800" width="112" height="40" rx="7" fill="#fff" stroke="#CBD5E1"/><text x="1144" y="825" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Cancelar</text><rect x="1212" y="800" width="134" height="40" rx="7" fill="#1D4ED8"/><text x="1279" y="825" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Criar Sede</text>
  </g>
  <g transform="translate(0 1000)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="1440" height="980" fill="#F6F8FB"/><rect width="248" height="980" fill="#FFFFFF"/><path d="M248 0v980" stroke="#DCE3EC"/>
    <rect x="24" y="23" width="36" height="36" rx="9" fill="#1D4ED8"/><path d="M34 33h16v16H34z" fill="none" stroke="#fff" stroke-width="2"/><text x="72" y="47" font-size="18" font-weight="700" fill="#0F172A">IEPRCard</text>
    <text x="24" y="100" font-size="11" font-weight="700" fill="#64748B">ADMINISTRAÇÃO GLOBAL</text><text x="24" y="126" font-size="14" font-weight="600" fill="#0F172A">Master · superadmin</text><path d="M24 148h200" stroke="#DCE3EC"/>
    <rect x="12" y="214" width="224" height="42" rx="8" fill="#EFF6FF"/><text x="30" y="240" font-size="14" font-weight="600" fill="#1D4ED8">Planos de clientes</text><text x="30" y="192" font-size="14" fill="#475569">Sedes e acessos</text><text x="30" y="289" font-size="14" fill="#475569">Perfil da instalação</text><text x="30" y="337" font-size="14" fill="#475569">Eventos técnicos</text><text x="30" y="385" font-size="14" fill="#475569">Backups</text>
    <rect x="248" y="0" width="1192" height="70" fill="#fff"/><path d="M248 70h1192" stroke="#DCE3EC"/><text x="280" y="42" font-size="13" fill="#64748B">Painel global /</text><text x="376" y="42" font-size="13" font-weight="600" fill="#0F172A">Planos de clientes</text>
    <text x="280" y="126" font-size="30" font-weight="700" fill="#0F172A">Planos de clientes</text><text x="280" y="155" font-size="14" fill="#475569">Defina recursos por plano. A conta Master não usa plano de cliente.</text>
    <rect x="1125" y="98" width="253" height="46" rx="8" fill="#1D4ED8"/><text x="1252" y="127" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">+ Novo plano</text>
    <rect x="280" y="181" width="1098" height="74" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/><text x="305" y="213" font-size="14" font-weight="700" fill="#1E3A8A">Planos controlam permissões e recursos da Sede</text><text x="305" y="237" font-size="13" fill="#334155">Os limites de unidades, equipe, titulares e emissões são atribuídos à Sede e continuam valendo quando o superadmin provisiona.</text>
    <rect x="280" y="277" width="1098" height="406" rx="10" fill="#fff" stroke="#DCE3EC"/><path d="M280 326h1098" stroke="#DCE3EC"/><text x="303" y="309" font-size="12" font-weight="700" fill="#64748B">PLANO</text><text x="590" y="309" font-size="12" font-weight="700" fill="#64748B">SEDES VINCULADAS</text><text x="830" y="309" font-size="12" font-weight="700" fill="#64748B">RECURSOS</text><text x="1100" y="309" font-size="12" font-weight="700" fill="#64748B">ESTADO</text><text x="1260" y="309" font-size="12" font-weight="700" fill="#64748B">AÇÃO</text>
    <rect x="303" y="352" width="1052" height="105" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="5 4"/><text x="829" y="393" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Nenhum plano de cliente cadastrado</text><text x="829" y="420" text-anchor="middle" font-size="13" fill="#64748B">Crie um plano para habilitar recursos e provisionar a primeira Sede.</text>
    <rect x="280" y="713" width="1098" height="104" rx="10" fill="#FFFFFF" stroke="#DCE3EC"/><text x="305" y="749" font-size="14" font-weight="700" fill="#0F172A">Novo plano de cliente</text><text x="305" y="777" font-size="13" fill="#475569">Nome, permissões e recursos (feature flags) são configurados aqui. Não há checkout, preço ou webhook no MVP.</text><text x="305" y="799" font-size="13" fill="#475569">Quando houver plano ativo, o superadmin pode atribuí-lo e definir cotas ao provisionar a Sede.</text>
    <rect x="280" y="853" width="1098" height="82" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/><text x="305" y="887" font-size="14" font-weight="700" fill="#1E3A8A">Estado local observado</text><text x="305" y="912" font-size="13" fill="#334155">Nenhum plano de cliente ativo: crie ou ative um antes de concluir o primeiro cadastro de Sede.</text>
  </g>
</svg>
