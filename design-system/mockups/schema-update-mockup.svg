<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title description">
  <title id="title">IEPRCard — Atualização do schema</title>
  <desc id="description">Área administrativa para verificar e enfileirar migrations de schema incluídas na release atual, com confirmação de backup e histórico auditável.</desc>
  <defs>
    <style>
      text { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .muted { fill: #475569; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .label { font-size: 13px; font-weight: 600; }
      .heading { fill: #0F172A; font-size: 26px; font-weight: 700; }
      .card-title { fill: #0F172A; font-size: 16px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#F6F8FB"/>
  <rect width="250" height="1000" fill="#FFFFFF"/>
  <line x1="249" y1="0" x2="249" y2="1000" stroke="#DCE3EC"/>
  <rect x="24" y="22" width="40" height="40" rx="10" fill="#1D4ED8"/>
  <path d="M34 42h20M44 32v20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="76" y="39" fill="#0F172A" font-size="17" font-weight="700">IEPRCard</text>
  <text x="76" y="56" fill="#64748B" font-size="11">ADMINISTRAÇÃO</text>
  <text x="24" y="108" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1">PLATAFORMA</text>
  <g font-size="14">
    <rect x="16" y="124" width="218" height="42" rx="8" fill="#FFFFFF"/><text x="58" y="150" fill="#475569">Visão geral</text>
    <rect x="16" y="174" width="218" height="42" rx="8" fill="#FFFFFF"/><text x="58" y="200" fill="#475569">Clientes</text>
    <rect x="16" y="224" width="218" height="42" rx="8" fill="#FFFFFF"/><text x="58" y="250" fill="#475569">Operações</text>
    <rect x="28" y="274" width="206" height="46" rx="8" fill="#EFF6FF"/>
    <rect x="28" y="274" width="3" height="46" rx="1.5" fill="#1D4ED8"/>
    <text x="48" y="294" fill="#1D4ED8" font-size="13" font-weight="650">Atualização de</text>
    <text x="48" y="311" fill="#1D4ED8" font-size="13" font-weight="650">schema</text>
    <rect x="16" y="328" width="218" height="54" rx="8" fill="#FFFFFF"/>
    <text x="38" y="349" fill="#475569" font-size="12">Migração de dados</text>
    <text x="38" y="366" fill="#475569" font-size="12">SQLite → MySQL</text>
  </g>
  <rect x="0" y="928" width="250" height="72" fill="#FFFFFF"/>
  <line x1="24" y1="928" x2="224" y2="928" stroke="#DCE3EC"/>
  <circle cx="46" cy="964" r="17" fill="#DBEAFE"/><text x="46" y="968" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="700">LN</text>
  <text x="72" y="960" fill="#0F172A" font-size="12" font-weight="650">Leonardo Nascimento</text><text x="72" y="977" fill="#64748B" font-size="11">Superadmin</text>

  <rect x="250" y="0" width="1190" height="70" fill="#FFFFFF"/><line x1="250" y1="70" x2="1440" y2="70" stroke="#DCE3EC"/>
  <text x="282" y="42" fill="#64748B" font-size="13">Administração <tspan fill="#CBD5E1">/</tspan> Infraestrutura <tspan fill="#CBD5E1">/</tspan> <tspan fill="#0F172A" font-weight="600">Atualização de schema</tspan></text>
  <rect x="1280" y="18" width="104" height="36" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1332" y="41" text-anchor="middle" fill="#334155" font-size="12" font-weight="600">Sair</text>

  <text x="282" y="115" fill="#64748B" font-size="12">Operações / Infraestrutura</text>
  <text x="282" y="157" class="heading">Atualização de schema</text>
  <text x="282" y="183" class="muted body">Aplique as migrations versionadas que acompanham a release atual.</text>
  <rect x="1170" y="118" width="214" height="34" rx="17" fill="#FEF3C7"/><circle cx="1190" cy="135" r="5" fill="#B45309"/><text x="1204" y="140" fill="#92400E" font-size="12" font-weight="650">Pré-verificação concluída</text>

  <rect x="282" y="207" width="1102" height="76" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="307" cy="245" r="12" fill="#DBEAFE"/><text x="307" y="250" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="700">i</text>
  <text x="331" y="237" fill="#1E3A8A" font-size="13" font-weight="700">Esta ação altera a estrutura do banco; não copia registros SQLite → MySQL.</text>
  <text x="331" y="258" fill="#1E40AF" font-size="12">Somente os arquivos numerados desta release podem ser executados. A tela não aceita SQL, nomes de arquivo ou comandos.</text>

  <rect x="282" y="301" width="1102" height="236" rx="10" fill="#FFFFFF" stroke="#DCE3EC"/>
  <text x="306" y="334" class="card-title">Pré-verificação da release</text>
  <text x="306" y="356" class="muted small">Os valores abaixo ilustram uma release com migrations pendentes.</text>
  <line x1="306" y1="371" x2="1360" y2="371" stroke="#E2E8F0"/>
  <text x="306" y="397" fill="#64748B" font-size="11" font-weight="700">AMBIENTE E BANCO</text>
  <text x="306" y="422" fill="#0F172A" font-size="14" font-weight="650">Produção · MySQL</text>
  <text x="306" y="444" class="muted small">Conexão verificada · credenciais ocultas</text>
  <rect x="306" y="460" width="330" height="48" rx="7" fill="#F8FAFC"/>
  <text x="320" y="481" fill="#475569" font-size="11">Schema esperado: 27 tabelas</text><text x="320" y="498" fill="#475569" font-size="11">Compatibilidade: 2 alterações versionadas pendentes</text>
  <line x1="671" y1="390" x2="671" y2="508" stroke="#E2E8F0"/>
  <text x="704" y="397" fill="#64748B" font-size="11" font-weight="700">ARQUIVOS DO RELEASE</text>
  <rect x="704" y="410" width="640" height="41" rx="6" fill="#F8FAFC"/>
  <circle cx="725" cy="430" r="8" fill="#DCFCE7"/><path d="m721 430 3 3 5-6" fill="none" stroke="#166534" stroke-width="1.7"/>
  <text x="744" y="434" fill="#0F172A" font-size="12" font-weight="600">0008_*.php</text><text x="912" y="434" fill="#475569" font-size="11">Expand-only · versão incluída no release</text>
  <rect x="704" y="460" width="640" height="41" rx="6" fill="#F8FAFC"/>
  <circle cx="725" cy="480" r="8" fill="#DCFCE7"/><path d="m721 480 3 3 5-6" fill="none" stroke="#166534" stroke-width="1.7"/>
  <text x="744" y="484" fill="#0F172A" font-size="12" font-weight="600">0009_*.php</text><text x="912" y="484" fill="#475569" font-size="11">Expand-only · versão incluída no release</text>
  <text x="704" y="523" fill="#64748B" font-size="11">A ordem e os hashes vêm do repositório; nada é informado pelo navegador.</text>

  <rect x="282" y="555" width="1102" height="119" rx="10" fill="#FFFFFF" stroke="#DCE3EC"/>
  <text x="306" y="586" class="card-title">Backup e janela de execução</text>
  <text x="306" y="609" class="muted small">Crie e confirme um backup restaurável no painel do provedor antes de continuar.</text>
  <rect x="306" y="626" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="336" y="640" fill="#334155" font-size="12">Confirmo que o backup recente foi criado e pode ser restaurado.</text>
  <text x="856" y="640" fill="#92400E" font-size="11">As migrations podem causar breve bloqueio no banco; escolha horário de baixo uso.</text>

  <rect x="282" y="692" width="1102" height="85" rx="10" fill="#FFFFFF" stroke="#DCE3EC"/>
  <text x="306" y="724" fill="#0F172A" font-size="13" font-weight="650">Execução serializada pelo worker de tarefas agendadas.</text>
  <text x="306" y="748" class="muted small">Após enfileirar, a página acompanha a fila e o resultado. Uma trava impede execuções concorrentes.</text>
  <rect x="1092" y="713" width="264" height="44" rx="8" fill="#CBD5E1"/><text x="1224" y="740" text-anchor="middle" fill="#64748B" font-size="13" font-weight="650">Enfileirar atualização</text>
  <text x="306" y="801" fill="#64748B" font-size="11">O botão é habilitado após confirmar o backup. Em falha, as alterações aditivas permanecem; o resultado informa se é seguro repetir.</text>

  <rect x="282" y="824" width="1102" height="146" rx="10" fill="#FFFFFF" stroke="#DCE3EC"/>
  <text x="306" y="856" class="card-title">Histórico de atualizações</text>
  <text x="306" y="878" class="muted small">Registra release, administrador, horário, resultado e validação do schema.</text>
  <rect x="306" y="894" width="1054" height="34" rx="5" fill="#F8FAFC"/>
  <text x="320" y="916" fill="#64748B" font-size="11" font-weight="700">RELEASE</text><text x="490" y="916" fill="#64748B" font-size="11" font-weight="700">EXECUTADA POR</text><text x="700" y="916" fill="#64748B" font-size="11" font-weight="700">DATA</text><text x="920" y="916" fill="#64748B" font-size="11" font-weight="700">RESULTADO</text><text x="1130" y="916" fill="#64748B" font-size="11" font-weight="700">SCHEMA</text>
  <text x="320" y="949" fill="#475569" font-size="12">Nenhuma atualização registrada neste ambiente.</text>
</svg>
