<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2320" viewBox="0 0 1440 2320" role="img" aria-labelledby="title description">
  <title id="title">Destinos externos de backup — configuração administrativa</title>
  <desc id="description">Proposta de extensão do painel desktop e mobile para configurar retenção e acompanhar a purga de snapshots, separando esse estado do teste de conexão.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/></filter>
    <style>
      text { font-family: Inter, system-ui, "Segoe UI", sans-serif; }
      .muted { fill: #475569; }
      .small { font-size: 13px; }
      .tiny { font-size: 11px; }
      .body { font-size: 15px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: .35px; }
      .title { font-size: 26px; font-weight: 700; fill: #0F172A; }
      .panel { fill: #FFFFFF; stroke: #DCE3EC; }
      .field { fill: #FFFFFF; stroke: #94A3B8; }
      .separator { stroke: #DCE3EC; }
    </style>
  </defs>
  <rect width="1440" height="2240" fill="#F6F8FB"/>
  <text x="32" y="30" class="label muted">IEPRCARD · MOCKUP ADMINISTRATIVO · PROPOSTA DE RETENÇÃO · DADOS FICTÍCIOS</text>

  <!-- Lista de destinos desktop -->
  <rect x="24" y="48" width="1392" height="752" rx="14" class="panel" filter="url(#shadow)"/>
  <rect x="24" y="48" width="220" height="752" rx="14" fill="#FFFFFF" stroke="#DCE3EC"/>
  <rect x="24" y="48" width="220" height="64" rx="14" fill="#FFFFFF"/>
  <rect x="48" y="65" width="32" height="32" rx="8" fill="#1D4ED8"/>
  <path d="M56 74h16v14H56zM60 70h8v4h-8z" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <text x="90" y="87" font-size="17" font-weight="700" fill="#0F172A">IEPRCard</text>
  <text x="48" y="145" class="tiny muted">ADMINISTRAÇÃO</text>
  <text x="64" y="184" class="small muted">Visão geral</text>
  <text x="64" y="224" class="small muted">Clientes</text>
  <text x="64" y="264" class="small muted">Domínios</text>
  <text x="64" y="304" class="small muted">Operação</text>
  <rect x="36" y="326" width="196" height="42" rx="7" fill="#EFF6FF"/>
  <rect x="36" y="326" width="3" height="42" rx="1.5" fill="#1D4ED8"/>
  <text x="64" y="352" class="small" font-weight="700" fill="#1D4ED8">Backup externo</text>
  <text x="64" y="408" class="small muted">IA e integrações</text>
  <text x="64" y="448" class="small muted">Segurança</text>
  <path d="M40 720h188" class="separator"/>
  <circle cx="62" cy="757" r="16" fill="#DBEAFE"/>
  <text x="62" y="762" text-anchor="middle" class="tiny" font-weight="700" fill="#1D4ED8">LN</text>
  <text x="88" y="754" class="small" font-weight="700" fill="#0F172A">Leonardo</text>
  <text x="88" y="773" class="tiny muted">Superadmin</text>

  <text x="272" y="96" class="small muted">Administração  /  Backup externo</text>
  <text x="272" y="143" class="title">Destinos externos</text>
  <text x="272" y="171" class="body muted">Cadastre destinos S3 compatíveis e valide o acesso antes de usá-los.</text>
  <rect x="1210" y="112" width="174" height="44" rx="8" fill="#1D4ED8"/>
  <text x="1297" y="140" text-anchor="middle" class="small" font-weight="700" fill="#FFFFFF">Adicionar destino</text>

  <rect x="272" y="194" width="1112" height="82" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
  <circle cx="298" cy="224" r="12" fill="#FEF3C7" stroke="#D97706"/>
  <text x="298" y="229" text-anchor="middle" class="small" font-weight="700" fill="#92400E">!</text>
  <text x="322" y="222" class="small" font-weight="700" fill="#78350F">Configuração e teste de conexão</text>
  <text x="322" y="246" class="small" fill="#78350F">O teste confirma escrita, leitura, listagem, metadado e purga de um objeto temporário.</text>
  <text x="322" y="264" class="tiny" fill="#78350F">Backup e retenção têm estados próprios; o teste não comprova que um snapshot foi enviado.</text>

  <rect x="272" y="296" width="350" height="82" rx="10" class="panel"/>
  <text x="296" y="325" class="small muted">Destinos cadastrados</text>
  <text x="296" y="356" font-size="23" font-weight="700" fill="#0F172A">2</text>
  <rect x="638" y="296" width="350" height="82" rx="10" class="panel"/>
  <text x="662" y="325" class="small muted">Conexões verificadas</text>
  <text x="662" y="356" font-size="23" font-weight="700" fill="#166534">1 de 2</text>
  <rect x="1004" y="296" width="380" height="82" rx="10" class="panel"/>
  <text x="1028" y="325" class="small muted">Último snapshot enviado</text>
  <text x="1028" y="356" font-size="20" font-weight="700" fill="#0F172A">22/11/2026 · 10:45</text>

  <rect x="272" y="398" width="1112" height="352" rx="10" class="panel"/>
  <text x="296" y="432" font-size="17" font-weight="700" fill="#0F172A">Destinos cadastrados</text>
  <text x="296" y="456" class="small muted">O teste usa um objeto temporário e o remove ao terminar.</text>
  <rect x="296" y="476" width="1064" height="38" rx="5" fill="#F6F8FB"/>
  <text x="312" y="500" class="label muted">DESTINO</text>
  <text x="542" y="500" class="label muted">BUCKET / ENDPOINT</text>
  <text x="904" y="500" class="label muted">CONEXÃO</text>
  <text x="1060" y="500" class="label muted">ÚLTIMO TESTE</text>
  <text x="1260" y="500" class="label muted">AÇÕES</text>
  <path d="M296 524h1064" class="separator"/>
  <text x="312" y="554" class="body" font-weight="700" fill="#0F172A">Cópia principal</text>
  <text x="312" y="577" class="small muted">S3 compatível · ativo</text>
  <text x="542" y="554" class="small" fill="#0F172A">iepr-prod-backups</text>
  <text x="542" y="577" class="tiny muted">https://storage.example.net</text>
  <rect x="904" y="538" width="126" height="26" rx="13" fill="#DCFCE7"/>
  <text x="967" y="556" text-anchor="middle" class="tiny" font-weight="700" fill="#166534">Conexão ok</text>
  <text x="1060" y="554" class="small" fill="#0F172A">22/11/2026 · 10:42</text>
  <text x="1060" y="577" class="tiny muted">Último teste bem-sucedido</text>
  <text x="1260" y="554" class="small" font-weight="700" fill="#1D4ED8">Testar</text>
  <text x="1310" y="554" class="small muted">Editar · Mais</text>
  <path d="M296 596h1064" class="separator"/>
  <text x="312" y="626" class="body" font-weight="700" fill="#0F172A">MinIO do escritório</text>
  <text x="312" y="649" class="small muted">S3 compatível · inativo</text>
  <text x="542" y="626" class="small" fill="#0F172A">iepr-recovery</text>
  <text x="542" y="649" class="tiny muted">https://minio.example.net</text>
  <rect x="904" y="610" width="126" height="26" rx="13" fill="#F1F5F9"/>
  <text x="967" y="628" text-anchor="middle" class="tiny" font-weight="700" fill="#475569">Não testada</text>
  <text x="1060" y="626" class="small muted">Ainda sem teste</text>
  <text x="1260" y="626" class="small" font-weight="700" fill="#1D4ED8">Testar</text>
  <text x="1310" y="626" class="small muted">Editar · Mais</text>
  <path d="M296 670h1064" class="separator"/>
  <text x="296" y="695" class="small muted">Menu Mais: ativar/desativar ou remover após confirmação.</text>
  <text x="296" y="720" class="small muted">Credenciais não são exibidas após salvar; digite novas para substituí-las.</text>
  <text x="296" y="742" class="tiny muted">Estados e datas usam rótulos, além de cores.</text>

  <!-- Formulário de destino -->
  <rect x="24" y="824" width="1392" height="870" rx="14" class="panel" filter="url(#shadow)"/>
  <rect x="24" y="824" width="1392" height="64" rx="14" fill="#FFFFFF"/>
  <path d="M24 888h1392" class="separator"/>
  <text x="64" y="865" class="label muted">ESTADO DE EDIÇÃO · CÓPIA PRINCIPAL</text>
  <text x="1376" y="865" text-anchor="end" class="small muted">Fechar</text>
  <text x="64" y="934" class="title">Editar destino S3</text>
  <text x="64" y="961" class="body muted">O teste usa um objeto temporário e não executa um backup.</text>

  <text x="64" y="1000" class="label" fill="#0F172A">NOME DO DESTINO</text>
  <rect x="64" y="1012" width="620" height="44" rx="7" class="field"/>
  <text x="80" y="1040" class="small muted">Ex.: Cópia principal</text>
  <text x="720" y="1000" class="label" fill="#0F172A">TIPO DE SERVIÇO</text>
  <rect x="720" y="1012" width="620" height="44" rx="7" class="field"/>
  <text x="736" y="1040" class="small" fill="#0F172A">Amazon S3 / endpoint compatível ▾</text>

  <text x="64" y="1092" class="label" fill="#0F172A">BUCKET</text>
  <rect x="64" y="1104" width="620" height="44" rx="7" class="field"/>
  <text x="80" y="1132" class="small muted">iepr-backups</text>
  <text x="720" y="1092" class="label" fill="#0F172A">REGIÃO</text>
  <rect x="720" y="1104" width="620" height="44" rx="7" class="field"/>
  <text x="736" y="1132" class="small muted">us-east-1 ou região indicada pelo serviço</text>

  <text x="64" y="1184" class="label" fill="#0F172A">ENDPOINT PERSONALIZADO</text>
  <rect x="64" y="1196" width="900" height="44" rx="7" class="field"/>
  <text x="80" y="1224" class="small muted">https://... · deixe vazio para usar o endpoint padrão da AWS</text>
  <rect x="990" y="1196" width="18" height="18" rx="3" fill="#1D4ED8"/>
  <path d="m994 1205 4 4 7-9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="1018" y="1211" class="small" fill="#0F172A">Usar endpoint por caminho</text>
  <text x="1018" y="1233" class="tiny muted">Necessário para vários serviços compatíveis.</text>

  <text x="64" y="1276" class="label" fill="#0F172A">ACCESS KEY</text>
  <rect x="64" y="1288" width="620" height="44" rx="7" class="field"/>
  <text x="80" y="1316" class="small muted">Deixe vazio para manter a chave atual</text>
  <text x="720" y="1276" class="label" fill="#0F172A">SECRET KEY</text>
  <rect x="720" y="1288" width="620" height="44" rx="7" class="field"/>
  <text x="736" y="1316" class="small muted">Deixe vazio para manter a chave atual</text>

  <text x="64" y="1360" class="label" fill="#0F172A">RETENÇÃO DE SNAPSHOTS</text>
  <rect x="64" y="1372" width="280" height="44" rx="7" class="field"/>
  <text x="80" y="1400" class="small" fill="#0F172A">30 dias</text>
  <text x="64" y="1437" class="tiny muted">Aceita de 1 a 3650 dias. Envelopes ativos e tombstones são preservados.</text>
  <rect x="376" y="1372" width="964" height="64" rx="8" fill="#F8FAFC" stroke="#DCE3EC"/>
  <text x="396" y="1398" class="small" font-weight="700" fill="#0F172A">Última purga: 22/11/2026 · 11:00</text>
  <text x="396" y="1421" class="tiny muted">Resultado: 3 snapshots removidos · sem falhas · versões e delete markers excluídos</text>

  <rect x="64" y="1460" width="1276" height="76" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="84" y="1489" class="small" font-weight="700" fill="#1E3A8A">Privacidade das credenciais</text>
  <text x="84" y="1515" class="small" fill="#1E3A8A">Depois de salvar, a tela mostra apenas se estão cadastradas. Para trocar, informe novas chaves; deixe os campos vazios para manter as atuais.</text>
  <rect x="64" y="1552" width="210" height="44" rx="7" fill="#FFFFFF" stroke="#1D4ED8"/>
  <text x="169" y="1580" text-anchor="middle" class="small" font-weight="700" fill="#1D4ED8">Testar conexão</text>
  <rect x="1128" y="1552" width="212" height="44" rx="7" fill="#1D4ED8"/>
  <text x="1234" y="1580" text-anchor="middle" class="small" font-weight="700" fill="#FFFFFF">Salvar alterações</text>
  <rect x="64" y="1612" width="1276" height="42" rx="7" fill="#DCFCE7" stroke="#86EFAC"/>
  <text x="84" y="1638" class="small" font-weight="700" fill="#166534">Último teste bem-sucedido: o objeto temporário foi enviado, listado, lido e removido.</text>

  <!-- Adaptação mobile -->
  <text x="40" y="1730" class="label muted">ADAPTAÇÃO MOBILE · VIEWPORT 390 PX</text>
  <rect x="40" y="1752" width="390" height="550" rx="24" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <rect x="58" y="1770" width="354" height="514" rx="16" fill="#F6F8FB"/>
  <rect x="58" y="1770" width="354" height="54" rx="16" fill="#FFFFFF"/>
  <rect x="76" y="1782" width="30" height="30" rx="7" fill="#1D4ED8"/>
  <text x="116" y="1803" font-size="16" font-weight="700" fill="#0F172A">IEPRCard</text>
  <text x="76" y="1856" class="tiny muted">ADMINISTRAÇÃO / BACKUP EXTERNO</text>
  <text x="76" y="1892" font-size="22" font-weight="700" fill="#0F172A">Destinos externos</text>
  <text x="76" y="1916" class="tiny muted">Backup e retenção têm status separados do teste.</text>
  <rect x="76" y="1938" width="318" height="174" rx="10" class="panel"/>
  <text x="94" y="1966" class="body" font-weight="700" fill="#0F172A">Cópia principal</text>
  <text x="94" y="1990" class="tiny muted">S3 · iepr-prod-backups · ativo</text>
  <rect x="94" y="2004" width="102" height="24" rx="12" fill="#DCFCE7"/>
  <text x="145" y="2021" text-anchor="middle" class="tiny" font-weight="700" fill="#166534">Conexão ok</text>
  <text x="94" y="2048" class="tiny muted">Snapshot: 22/11/2026 10:45</text>
  <text x="94" y="2072" class="tiny muted">Retenção 30 dias · purga sem falhas</text>
  <text x="94" y="2096" class="tiny" font-weight="700" fill="#1D4ED8">Testar · Editar · Remover</text>
  <rect x="76" y="2128" width="318" height="44" rx="7" fill="#1D4ED8"/>
  <text x="235" y="2156" text-anchor="middle" class="small" font-weight="700" fill="#FFFFFF">Adicionar destino</text>
  <text x="76" y="2204" class="tiny muted">Tabela e formulário passam para cartões e coluna única.</text>
  <text x="76" y="2224" class="tiny muted">Sem rolagem horizontal; status usa rótulo e texto.</text>
</svg>
