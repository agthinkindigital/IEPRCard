<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Cotas distribuídas entre as unidades</title>
  <desc id="description">Resumo dos tetos da Sede, alocações fixas por unidade e uso do pool compartilhado.</desc>
  <rect width="1440" height="900" fill="#F6F8FB"/><rect width="248" height="900" fill="#fff"/><path d="M248 0v900" stroke="#DCE3EC"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="24" y="23" width="36" height="36" rx="9" fill="#1D4ED8"/><path d="M34 33h16v16H34z" fill="none" stroke="#fff" stroke-width="2"/><text x="72" y="47" font-size="18" font-weight="700" fill="#0F172A">IEPRCard</text><text x="24" y="101" font-size="11" font-weight="700" fill="#64748B">INSTITUIÇÃO</text><text x="24" y="127" font-size="14" font-weight="600" fill="#0F172A">Instituto Exemplo</text><path d="M24 148h200" stroke="#DCE3EC"/>
    <rect x="12" y="167" width="224" height="42" rx="8" fill="#EFF6FF"/><text x="30" y="193" font-size="14" font-weight="600" fill="#1D4ED8">Unidades e equipe</text><text x="30" y="246" font-size="14" fill="#475569">Titulares</text><text x="30" y="294" font-size="14" fill="#475569">Designs</text><text x="30" y="342" font-size="14" fill="#475569">Domínios próprios</text><text x="30" y="390" font-size="14" fill="#475569">Atividade</text>
    <rect x="248" y="0" width="1192" height="70" fill="#fff"/><path d="M248 70h1192" stroke="#DCE3EC"/><text x="280" y="42" font-size="13" fill="#64748B">Painel / Unidades e equipe /</text><text x="472" y="42" font-size="13" font-weight="600" fill="#0F172A">Cotas</text>
    <text x="280" y="126" font-size="30" font-weight="700" fill="#0F172A">Cotas da rede</text><text x="280" y="154" font-size="14" fill="#475569">Distribua os limites da Sede entre as unidades sem ultrapassar o plano.</text><rect x="1194" y="100" width="184" height="44" rx="8" fill="#F1F5F9"/><text x="1286" y="127" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Tetos da plataforma</text>
    <rect x="280" y="181" width="1098" height="143" rx="10" fill="#fff" stroke="#DCE3EC"/><text x="305" y="214" font-size="16" font-weight="700" fill="#0F172A">Limites definidos para a Sede</text><text x="305" y="237" font-size="11" fill="#64748B">Valores ilustrativos; o administrador da plataforma define estes tetos.</text>
    <text x="305" y="276" font-size="11" font-weight="600" fill="#64748B">UNIDADES</text><text x="305" y="302" font-size="20" font-weight="700" fill="#0F172A">4 / 6</text><text x="542" y="276" font-size="11" font-weight="600" fill="#64748B">EQUIPE</text><text x="542" y="302" font-size="20" font-weight="700" fill="#0F172A">8 / 15</text><text x="779" y="276" font-size="11" font-weight="600" fill="#64748B">TITULARES ATIVOS</text><text x="779" y="302" font-size="20" font-weight="700" fill="#0F172A">1.240 / 3.000</text><text x="1054" y="276" font-size="11" font-weight="600" fill="#64748B">EMISSÕES NO PERÍODO</text><text x="1054" y="302" font-size="20" font-weight="700" fill="#0F172A">1.800 / 5.000</text>
    <rect x="280" y="344" width="1098" height="472" rx="10" fill="#fff" stroke="#DCE3EC"/><text x="305" y="384" font-size="17" font-weight="700" fill="#0F172A">Alocações por unidade</text><text x="305" y="407" font-size="12" fill="#64748B">Cota fixa reserva parte do limite; Pool usa o saldo compartilhado da Sede.</text>
    <rect x="305" y="429" width="1048" height="43" rx="6" fill="#F8FAFC"/><text x="322" y="456" font-size="11" font-weight="700" fill="#64748B">UNIDADE</text><text x="573" y="456" font-size="11" font-weight="700" fill="#64748B">EQUIPE</text><text x="766" y="456" font-size="11" font-weight="700" fill="#64748B">TITULARES</text><text x="1001" y="456" font-size="11" font-weight="700" fill="#64748B">EMISSÕES</text><text x="1207" y="456" font-size="11" font-weight="700" fill="#64748B">AÇÕES</text>
    <path d="M305 472h1048" stroke="#DCE3EC"/>
    <text x="322" y="510" font-size="12" font-weight="600" fill="#0F172A">Unidade Centro</text><text x="573" y="510" font-size="12" fill="#334155">3 fixas</text><text x="766" y="510" font-size="12" fill="#334155">800 fixos</text><text x="1001" y="510" font-size="12" fill="#334155">1.500 fixas</text><text x="1207" y="510" font-size="12" font-weight="600" fill="#1D4ED8">Editar</text><path d="M305 534h1048" stroke="#E2E8F0"/>
    <text x="322" y="572" font-size="12" font-weight="600" fill="#0F172A">Unidade Norte</text><text x="573" y="572" font-size="12" fill="#334155">Pool</text><text x="766" y="572" font-size="12" fill="#334155">Pool</text><text x="1001" y="572" font-size="12" fill="#334155">Pool</text><text x="1207" y="572" font-size="12" font-weight="600" fill="#1D4ED8">Editar</text><path d="M305 596h1048" stroke="#E2E8F0"/>
    <text x="322" y="634" font-size="12" font-weight="600" fill="#0F172A">Unidade Sul</text><text x="573" y="634" font-size="12" fill="#334155">2 fixas</text><text x="766" y="634" font-size="12" fill="#334155">600 fixos</text><text x="1001" y="634" font-size="12" fill="#334155">1.000 fixas</text><text x="1207" y="634" font-size="12" font-weight="600" fill="#1D4ED8">Editar</text><path d="M305 658h1048" stroke="#E2E8F0"/>
    <rect x="305" y="680" width="1048" height="97" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/><text x="327" y="710" font-size="12" font-weight="700" fill="#1E3A8A">Reserva fixa total</text><text x="327" y="735" font-size="11" fill="#1E40AF">Equipe: 5 de 15 · Titulares: 1.400 de 3.000 · Emissões: 2.500 de 5.000</text><text x="327" y="759" font-size="11" fill="#1E40AF">O restante continua disponível no Pool da Sede. A soma fixa nunca pode ultrapassar o teto.</text>
  </g>
</svg>
