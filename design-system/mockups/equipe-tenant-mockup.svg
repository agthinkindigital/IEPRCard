<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Equipe e acessos das unidades</title>
  <desc id="description">Sede administra responsáveis de unidade e delega permissões dentro do limite do plano.</desc>
  <rect width="1440" height="900" fill="#F6F8FB"/><rect width="248" height="900" fill="#fff"/><path d="M248 0v900" stroke="#DCE3EC"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="24" y="23" width="36" height="36" rx="9" fill="#1D4ED8"/><path d="M34 33h16v16H34z" fill="none" stroke="#fff" stroke-width="2"/><text x="72" y="47" font-size="18" font-weight="700" fill="#0F172A">IEPRCard</text><text x="24" y="101" font-size="11" font-weight="700" fill="#64748B">INSTITUIÇÃO</text><text x="24" y="127" font-size="14" font-weight="600" fill="#0F172A">Instituto Exemplo</text><path d="M24 148h200" stroke="#DCE3EC"/>
    <rect x="12" y="167" width="224" height="42" rx="8" fill="#EFF6FF"/><text x="30" y="193" font-size="14" font-weight="600" fill="#1D4ED8">Unidades e equipe</text><text x="30" y="246" font-size="14" fill="#475569">Titulares</text><text x="30" y="294" font-size="14" fill="#475569">Designs</text><text x="30" y="342" font-size="14" fill="#475569">Domínios próprios</text><text x="30" y="390" font-size="14" fill="#475569">Atividade</text>
    <rect x="248" y="0" width="1192" height="70" fill="#fff"/><path d="M248 70h1192" stroke="#DCE3EC"/><text x="280" y="42" font-size="13" fill="#64748B">Painel / Unidades e equipe /</text><text x="472" y="42" font-size="13" font-weight="600" fill="#0F172A">Equipe</text>
    <text x="280" y="126" font-size="30" font-weight="700" fill="#0F172A">Equipe</text><text x="280" y="154" font-size="14" fill="#475569">Gerencie quem opera cada unidade e o que pode fazer.</text><rect x="1172" y="100" width="206" height="46" rx="8" fill="#1D4ED8"/><text x="1275" y="129" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">+ Adicionar operador</text>
    <rect x="280" y="181" width="1098" height="66" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/><circle cx="307" cy="214" r="11" fill="#DBEAFE"/><text x="307" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">i</text><text x="329" y="210" font-size="13" font-weight="600" fill="#1E3A8A">A criação e a gestão de acessos são exclusivas da Sede.</text><text x="329" y="229" font-size="12" fill="#1E40AF">Operadores de unidade não podem criar outros usuários nem ampliar as permissões delegadas.</text>
    <rect x="280" y="267" width="1098" height="522" rx="10" fill="#fff" stroke="#DCE3EC"/><text x="305" y="307" font-size="17" font-weight="700" fill="#0F172A">Operadores das unidades</text><text x="305" y="330" font-size="12" fill="#64748B">Acesso da conta: 8 de 15 operadores utilizados</text>
    <rect x="305" y="351" width="1048" height="42" rx="6" fill="#F8FAFC"/><text x="322" y="377" font-size="11" font-weight="700" fill="#64748B">PESSOA</text><text x="590" y="377" font-size="11" font-weight="700" fill="#64748B">UNIDADE</text><text x="810" y="377" font-size="11" font-weight="700" fill="#64748B">PERFIL</text><text x="1000" y="377" font-size="11" font-weight="700" fill="#64748B">ACESSO</text><text x="1170" y="377" font-size="11" font-weight="700" fill="#64748B">AÇÕES</text>
    <path d="M305 393h1048" stroke="#DCE3EC"/>
    <circle cx="342" cy="429" r="16" fill="#DBEAFE"/><text x="342" y="433" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">MS</text><text x="369" y="426" font-size="12" font-weight="600" fill="#0F172A">Marina Souza</text><text x="369" y="444" font-size="11" fill="#64748B">marina@instituto-exemplo.org.br</text><text x="590" y="434" font-size="12" fill="#334155">Unidade Centro</text><text x="810" y="434" font-size="12" fill="#334155">Responsável da unidade</text><rect x="1000" y="416" width="65" height="24" rx="12" fill="#DCFCE7"/><text x="1032" y="432" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Ativo</text><text x="1170" y="434" font-size="12" font-weight="600" fill="#1D4ED8">Ver acesso</text><path d="M305 465h1048" stroke="#E2E8F0"/>
    <circle cx="342" cy="500" r="16" fill="#EDE9FE"/><text x="342" y="504" text-anchor="middle" font-size="10" font-weight="700" fill="#6D28D9">RL</text><text x="369" y="497" font-size="12" font-weight="600" fill="#0F172A">Rafael Lima</text><text x="369" y="515" font-size="11" fill="#64748B">rafael@instituto-exemplo.org.br</text><text x="590" y="505" font-size="12" fill="#334155">Unidade Norte</text><text x="810" y="505" font-size="12" fill="#334155">Responsável da unidade</text><rect x="1000" y="487" width="65" height="24" rx="12" fill="#DCFCE7"/><text x="1032" y="503" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Ativo</text><text x="1170" y="505" font-size="12" font-weight="600" fill="#1D4ED8">Ver acesso</text><path d="M305 536h1048" stroke="#E2E8F0"/>
    <circle cx="342" cy="571" r="16" fill="#FEF3C7"/><text x="342" y="575" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">PS</text><text x="369" y="568" font-size="12" font-weight="600" fill="#0F172A">Paulo Santos</text><text x="369" y="586" font-size="11" fill="#64748B">paulo@instituto-exemplo.org.br</text><text x="590" y="576" font-size="12" fill="#334155">Unidade Leste</text><text x="810" y="576" font-size="12" fill="#334155">Responsável da unidade</text><rect x="1000" y="558" width="65" height="24" rx="12" fill="#DCFCE7"/><text x="1032" y="574" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Ativo</text><text x="1170" y="576" font-size="12" font-weight="600" fill="#1D4ED8">Ver acesso</text><path d="M305 607h1048" stroke="#E2E8F0"/>
    <text x="305" y="649" font-size="13" font-weight="700" fill="#0F172A">Permissões delegadas às unidades</text><text x="305" y="672" font-size="12" fill="#475569">Estas permissões são o limite máximo de acesso dos operadores da rede.</text><rect x="305" y="692" width="1048" height="67" rx="7" fill="#F8FAFC" stroke="#E2E8F0"/><text x="326" y="720" font-size="12" font-weight="600" fill="#334155">Titulares</text><text x="448" y="720" font-size="12" fill="#334155">Ver e cadastrar</text><text x="650" y="720" font-size="12" font-weight="600" fill="#334155">Carteirinhas</text><text x="782" y="720" font-size="12" fill="#334155">Ver e emitir</text><text x="1000" y="720" font-size="12" font-weight="600" fill="#1D4ED8">Editar permissões</text><text x="326" y="742" font-size="11" fill="#64748B">O perfil de cada pessoa pode restringir ainda mais este limite.</text>
    <text x="305" y="822" font-size="11" fill="#64748B">Novos acessos respeitam o limite total da Sede e o limite opcional da unidade.</text>
  </g>
</svg>
