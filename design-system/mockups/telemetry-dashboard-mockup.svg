  <text x="576" y="2127" class="small">Todos os clientes · últimos 30 dias</text>
  <rect x="560" y="2154" width="320" height="80" rx="10" class="card"/>
  <text x="578" y="2182" class="tiny muted">PICO P95 · 30 DIAS COMPLETOS</text>
  <text x="578" y="2215" class="heading">420 <tspan class="small">/ dia</tspan></text>
  <rect x="560" y="2246" width="320" height="70" rx="10" class="lightgreen"/>
  <text x="578" y="2274" class="tiny muted">LOTE RECOMENDADO</text>
  <text x="578" y="2304" class="heading">420</text>
  <text x="560" y="2350" class="label">Configuração manual</text>
  <rect x="560" y="2362" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#64748B"/>
  <text x="574" y="2382" class="tiny muted">LOTE MÁXIMO · EDITÁVEL</text><text x="574" y="2402" class="small">300 registros</text>
  <rect x="560" y="2418" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#64748B"/>
  <text x="574" y="2438" class="tiny muted">PICO ESPERADO · EDITÁVEL</text><text x="574" y="2458" class="small">420 por dia</text>
  <rect x="560" y="2474" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#64748B"/>
