  <text x="720" y="2556" text-anchor="middle" class="small" fill="#FFFFFF">Salvar ajustes</text>
  <text x="560" y="2590" class="tiny muted">Salvar pede confirmação; o worker carrega</text>
  <text x="560" y="2607" class="tiny muted">a versão pendente no próximo início.</text>
