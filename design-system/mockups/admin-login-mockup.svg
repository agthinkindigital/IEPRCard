<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title description">
  <title id="title">Configuração inicial e acesso administrativo do IEPRCard</title>
  <desc id="description">Comparação dos dois estados da mesma página: criação do primeiro superadmin quando o banco não tem usuários e login administrativo depois da configuração.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1440" height="1040" fill="#F6F8FB"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="72" y="48" width="42" height="42" rx="10" fill="#1D4ED8"/>
    <path d="M84 61h18v16H84zM88 56h10v5H88z" fill="#FFFFFF"/>
    <text x="128" y="76" font-size="20" font-weight="700" fill="#0F172A">IEPRCard</text>
    <text x="1368" y="74" text-anchor="end" font-size="14" fill="#475569">Acesso administrativo</text>

    <text x="360" y="142" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#475569">PRIMEIRO ACESSO · BANCO SEM USUÁRIOS</text>
    <text x="1080" y="142" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#475569">SISTEMA CONFIGURADO · JÁ EXISTEM USUÁRIOS</text>

    <g filter="url(#shadow)">
      <rect x="100" y="170" width="520" height="760" rx="18" fill="#FFFFFF" stroke="#DCE3EC"/>
      <rect x="820" y="170" width="520" height="650" rx="18" fill="#FFFFFF" stroke="#DCE3EC"/>
    </g>

    <g>
      <circle cx="360" cy="232" r="30" fill="#EFF6FF"/>
      <path d="M360 214a12 12 0 0 1 12 12v5h4v20h-32v-20h4v-5a12 12 0 0 1 12-12zm-7 17h14v-5a7 7 0 1 0-14 0z" fill="#1D4ED8"/>
      <text x="360" y="292" text-anchor="middle" font-size="25" font-weight="700" fill="#0F172A">Configurar administrador</text>
      <text x="360" y="320" text-anchor="middle" font-size="14" fill="#475569">Este será o primeiro usuário global do sistema.</text>

      <text x="148" y="376" font-size="14" font-weight="600" fill="#0F172A">Nome</text>
      <rect x="148" y="389" width="424" height="48" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="164" y="419" font-size="14" fill="#64748B">Seu nome</text>

      <text x="148" y="470" font-size="14" font-weight="600" fill="#0F172A">E-mail</text>
      <rect x="148" y="483" width="424" height="48" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="164" y="513" font-size="14" fill="#64748B">nome@exemplo.com</text>

      <text x="148" y="564" font-size="14" font-weight="600" fill="#0F172A">Senha</text>
      <rect x="148" y="577" width="424" height="48" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="164" y="607" font-size="17" letter-spacing="4" fill="#64748B">••••••••••••</text>

      <text x="148" y="658" font-size="14" font-weight="600" fill="#0F172A">Confirmar senha</text>
      <rect x="148" y="671" width="424" height="48" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="164" y="701" font-size="17" letter-spacing="4" fill="#64748B">••••••••••••</text>

      <rect x="148" y="752" width="424" height="52" rx="8" fill="#1D4ED8"/>
      <text x="360" y="785" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Criar administrador</text>

      <path d="M148 836h424" stroke="#DCE3EC"/>
      <text x="360" y="865" text-anchor="middle" font-size="13" fill="#475569">Disponível somente enquanto não houver usuários.</text>
      <text x="360" y="887" text-anchor="middle" font-size="13" fill="#475569">Após criar a conta, você será direcionado ao login.</text>
    </g>

    <g>
      <circle cx="1080" cy="232" r="30" fill="#EFF6FF"/>
      <path d="M1080 214a12 12 0 0 1 12 12v5h4v20h-32v-20h4v-5a12 12 0 0 1 12-12zm-7 17h14v-5a7 7 0 1 0-14 0z" fill="#1D4ED8"/>
      <text x="1080" y="292" text-anchor="middle" font-size="25" font-weight="700" fill="#0F172A">Entrar na administração</text>
      <text x="1080" y="320" text-anchor="middle" font-size="14" fill="#475569">Acesso restrito ao Administrador SaaS</text>

      <text x="868" y="390" font-size="14" font-weight="600" fill="#0F172A">E-mail</text>
      <rect x="868" y="403" width="424" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="884" y="435" font-size="15" fill="#64748B">nome@exemplo.com</text>

      <text x="868" y="496" font-size="14" font-weight="600" fill="#0F172A">Senha</text>
      <rect x="868" y="509" width="424" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="884" y="541" font-size="18" letter-spacing="4" fill="#64748B">••••••••••</text>
      <text x="1272" y="541" text-anchor="end" font-size="13" font-weight="600" fill="#1D4ED8">Mostrar</text>

      <rect x="868" y="589" width="424" height="52" rx="8" fill="#1D4ED8"/>
      <text x="1080" y="622" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Entrar</text>

      <path d="M868 682h424" stroke="#DCE3EC"/>
      <text x="1080" y="711" text-anchor="middle" font-size="13" fill="#475569">Acesso restrito e protegido contra abuso.</text>
    </g>

    <text x="720" y="990" text-anchor="middle" font-size="13" fill="#475569">A mesma URL apresenta apenas o estado permitido pela situação da conta.</text>
  </g>
</svg>
