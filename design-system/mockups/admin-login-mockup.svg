<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">Acesso administrativo do IEPRCard</title>
  <desc id="description">Tela de login centralizada para Administrador SaaS, com campos de e-mail e senha, botão Entrar e informação de acesso restrito.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1440" height="960" fill="#F6F8FB"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(0 0)">
      <rect x="72" y="56" width="42" height="42" rx="10" fill="#1D4ED8"/>
      <path d="M84 69h18v16H84zM88 64h10v5H88z" fill="#FFFFFF"/>
      <text x="128" y="84" font-size="20" font-weight="700" fill="#0F172A">IEPRCard</text>
      <text x="1368" y="82" text-anchor="end" font-size="14" fill="#475569">Ambiente administrativo</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="480" y="190" width="480" height="598" rx="18" fill="#FFFFFF" stroke="#DCE3EC"/>
    </g>
    <g>
      <circle cx="720" cy="258" r="32" fill="#EFF6FF"/>
      <path d="M720 240a12 12 0 0 1 12 12v5h4v22h-32v-22h4v-5a12 12 0 0 1 12-12zm-7 17h14v-5a7 7 0 1 0-14 0z" fill="#1D4ED8"/>
      <text x="720" y="334" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">Entrar na administração</text>
      <text x="720" y="365" text-anchor="middle" font-size="15" fill="#475569">Acesso restrito ao Administrador SaaS</text>

      <text x="536" y="425" font-size="14" font-weight="600" fill="#0F172A">E-mail</text>
      <rect x="536" y="440" width="368" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="552" y="472" font-size="15" fill="#64748B">nome@exemplo.com</text>

      <text x="536" y="533" font-size="14" font-weight="600" fill="#0F172A">Senha</text>
      <rect x="536" y="548" width="368" height="52" rx="8" fill="#FFFFFF" stroke="#94A3B8"/>
      <text x="552" y="580" font-size="18" letter-spacing="4" fill="#64748B">••••••••••</text>
      <text x="884" y="580" text-anchor="end" font-size="13" font-weight="600" fill="#1D4ED8">Mostrar</text>

      <rect x="536" y="628" width="368" height="52" rx="8" fill="#1D4ED8"/>
      <text x="720" y="661" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Entrar</text>

      <path d="M536 718h368" stroke="#DCE3EC"/>
      <text x="720" y="747" text-anchor="middle" font-size="13" fill="#475569">Acesso restrito e protegido contra abuso.</text>
    </g>
    <g fill="#475569" font-size="13">
      <text x="720" y="854" text-anchor="middle">IEPRCard · Área restrita</text>
      <text x="720" y="878" text-anchor="middle">Se a sessão expirar, entre novamente para continuar.</text>
    </g>
  </g>
</svg>
