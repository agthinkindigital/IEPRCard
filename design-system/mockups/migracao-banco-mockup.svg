<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
  <title id="title">IEPRCard — Migração de banco</title>
  <desc id="description">Painel administrativo para conferir a origem SQLite e o destino MySQL antes de iniciar uma cópia controlada.</desc>
  <defs>
    <style>
      text { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .muted { fill: #475569; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .label { font-size: 13px; font-weight: 600; }
      .heading { fill: #0F172A; font-size: 24px; font-weight: 700; }
      .card-title { fill: #0F172A; font-size: 16px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1440" height="1080" fill="#F6F8FB"/>

  <rect x="0" y="0" width="250" height="1080" fill="#FFFFFF"/>
  <line x1="249" y1="0" x2="249" y2="1080" stroke="#DCE3EC"/>
  <rect x="24" y="22" width="40" height="40" rx="10" fill="#1D4ED8"/>
  <path d="M34 42h20M44 32v20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="76" y="39" fill="#0F172A" font-size="17" font-weight="700">IEPRCard</text>
  <text x="76" y="56" fill="#64748B" font-size="11">ADMINISTRAÇÃO</text>
  <text x="24" y="108" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1">PLATAFORMA</text>

  <g fill="#475569" font-size="14">
    <rect x="16" y="124" width="218" height="42" rx="8" fill="#FFFFFF"/>
    <circle cx="38" cy="145" r="7" fill="none" stroke="#64748B" stroke-width="1.6"/>
    <text x="58" y="150">Visão geral</text>
    <rect x="16" y="174" width="218" height="42" rx="8" fill="#FFFFFF"/>
    <circle cx="38" cy="195" r="7" fill="none" stroke="#64748B" stroke-width="1.6"/>
    <text x="58" y="200">Clientes</text>
    <rect x="16" y="224" width="218" height="42" rx="8" fill="#FFFFFF"/>
    <path d="M31 245h14M38 238v14" stroke="#64748B" stroke-width="1.6"/>
    <text x="58" y="250">Operações</text>
    <rect x="28" y="272" width="206" height="42" rx="8" fill="#EFF6FF"/>
    <rect x="28" y="272" width="3" height="42" rx="1.5" fill="#1D4ED8"/>
    <path d="M45 285h13v16H45zM48 289h7M48 293h7M48 297h5" fill="none" stroke="#1D4ED8" stroke-width="1.4"/>
    <text x="68" y="298" fill="#1D4ED8" font-weight="650">Migração de banco</text>
    <rect x="16" y="326" width="218" height="42" rx="8" fill="#FFFFFF"/>
    <circle cx="38" cy="347" r="7" fill="none" stroke="#64748B" stroke-width="1.6"/>
    <path d="M38 343v5l3 2" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <text x="58" y="352">Auditoria</text>
    <rect x="16" y="376" width="218" height="42" rx="8" fill="#FFFFFF"/>
    <path d="M32 389h12v14H32zM35 386h12v14" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <text x="58" y="402">Configurações</text>
  </g>

  <line x1="16" y1="1020" x2="234" y2="1020" stroke="#DCE3EC"/>
  <circle cx="42" cy="1050" r="17" fill="#E2E8F0"/>
  <text x="42" y="1054" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">LN</text>
  <text x="68" y="1047" fill="#0F172A" font-size="13" font-weight="600">Administrador</text>
  <text x="68" y="1064" fill="#64748B" font-size="11">Acesso restrito</text>

  <rect x="250" y="0" width="1190" height="72" fill="#FFFFFF"/>
  <line x1="250" y1="71" x2="1440" y2="71" stroke="#DCE3EC"/>
  <text x="286" y="43" fill="#64748B" font-size="13">Administração</text>
  <text x="389" y="43" fill="#94A3B8" font-size="13">/</text>
  <text x="407" y="43" fill="#0F172A" font-size="13" font-weight="600">Infraestrutura</text>
  <rect x="1275" y="23" width="133" height="28" rx="14" fill="#EFF6FF"/>
  <circle cx="1292" cy="37" r="4" fill="#1D4ED8"/>
  <text x="1303" y="41" fill="#1E40AF" font-size="11" font-weight="650">HOMOLOGAÇÃO</text>

  <text x="286" y="119" fill="#64748B" font-size="12">Operações  /  Infraestrutura</text>
  <text x="286" y="158" class="heading">Migração de banco</text>
  <text x="286" y="184" class="muted body">Copie os dados do SQLite para o MySQL após validar a origem e o destino.</text>
  <rect x="1250" y="127" width="158" height="32" rx="7" fill="#FFFFFF" stroke="#DCE3EC"/>
  <circle cx="1268" cy="143" r="4" fill="#166534"/>
  <text x="1280" y="147" fill="#166534" font-size="12" font-weight="650">Serviço conectado</text>

  <rect x="286" y="207" width="1122" height="56" rx="9" fill="#FFFBEB" stroke="#FDE68A"/>
  <circle cx="311" cy="235" r="10" fill="#FEF3C7" stroke="#D97706"/>
  <text x="311" y="239" text-anchor="middle" fill="#92400E" font-size="13" font-weight="700">!</text>
  <text x="332" y="231" fill="#78350F" font-size="13" font-weight="650">A cópia só começa após todas as verificações passarem.</text>
  <text x="332" y="249" fill="#92400E" font-size="12">O destino precisa estar vazio. Nenhum registro pessoal será exibido nesta tela.</text>

  <rect x="286" y="283" width="546" height="166" rx="10" fill="#FFFFFF" stroke="#DCE3EC"/>
  <circle cx="314" cy="313" r="13" fill="#EFF6FF"/>
  <path d="M308 313h12M314 307v12" stroke="#1D4ED8" stroke-width="1.7" stroke-linecap="round"/>
  <text x="339" y="318" class="card-title">Origem SQLite</text>
  <rect x="738" y="299" width="72" height="24" rx="12" fill="#F0FDF4"/>
  <circle cx="751" cy="311" r="3.5" fill="#166534"/>
  <text x="761" y="315" fill="#166534" font-size="11" font-weight="650">VÁLIDA</text>
  <line x1="310" y1="337" x2="808" y2="337" stroke="#E2E8F0"/>
  <text x="310" y="363" fill="#64748B" font-size="12">Arquivo</text>
  <text x="425" y="363" fill="#0F172A" font-size="13" font-weight="600">ieprcard.sqlite</text>
  <text x="310" y="391" fill="#64748B" font-size="12">Schema</text>
  <text x="425" y="391" fill="#0F172A" font-size="13">27 tabelas canônicas</text>
  <text x="310" y="419" fill="#64748B" font-size="12">Registros</text>
  <text x="425" y="419" fill="#0F172A" font-size="13">1.284 registros em 8 tabelas</text>
  <text x="310" y="439" fill="#64748B" font-size="11">Caminho completo oculto</text>

  <rect x="850" y="283" width="558" height="166" rx="10" fill="#FFFFFF" stroke="#DCE3EC"/>
  <circle cx="878" cy="313" r="13" fill="#EFF6FF"/>
  <rect x="872" y="307" width="12" height="12" rx="2" fill="none" stroke="#1D4ED8" stroke-width="1.6"/>
  <path d="M875 311h6M875 314h6" stroke="#1D4ED8" stroke-width="1.3"/>
  <text x="903" y="318" class="card-title">Destino MySQL / MariaDB</text>
  <rect x="1314" y="299" width="70" height="24" rx="12" fill="#F0FDF4"/>
  <circle cx="1327" cy="311" r="3.5" fill="#166534"/>
  <text x="1337" y="315" fill="#166534" font-size="11" font-weight="650">VÁLIDO</text>
  <line x1="874" y1="337" x2="1384" y2="337" stroke="#E2E8F0"/>
  <text x="874" y="363" fill="#64748B" font-size="12">Banco</text>
  <text x="987" y="363" fill="#0F172A" font-size="13" font-weight="600">ieprcard_prod</text>
  <text x="874" y="391" fill="#64748B" font-size="12">Conexão</text>
  <text x="987" y="391" fill="#0F172A" font-size="13">Conectada · credenciais ocultas</text>
  <text x="874" y="419" fill="#64748B" font-size="12">Registros atuais</text>
  <text x="987" y="419" fill="#166534" font-size="13" font-weight="650">0 · pronto para receber</text>

  <rect x="286" y="469" width="1122" height="250" rx="10" fill="#FFFFFF" stroke="#DCE3EC"/>
  <text x="310" y="502" class="card-title">Pré-verificações</text>
  <text x="310" y="524" class="muted small">A validação foi executada há 2 minutos.</text>
  <rect x="1253" y="486" width="131" height="32" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <path d="M1272 497a7 7 0 1 0 5 12M1272 494v5h5" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1285" y="507" fill="#334155" font-size="12" font-weight="600">Validar novamente</text>
  <line x1="310" y1="541" x2="1384" y2="541" stroke="#E2E8F0"/>

  <g font-size="13">
    <circle cx="322" cy="568" r="8" fill="#DCFCE7"/>
    <path d="M318 568l3 3 5-6" fill="none" stroke="#166534" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="342" y="572" fill="#0F172A" font-weight="600">Schema de origem compatível</text>
    <text x="1150" y="572" fill="#166534" font-weight="650">Aprovado</text>
    <line x1="310" y1="586" x2="1384" y2="586" stroke="#F1F5F9"/>

    <circle cx="322" cy="611" r="8" fill="#DCFCE7"/>
    <path d="M318 611l3 3 5-6" fill="none" stroke="#166534" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="342" y="615" fill="#0F172A" font-weight="600">Integridade referencial da origem</text>
    <text x="1150" y="615" fill="#166534" font-weight="650">Aprovado</text>
    <line x1="310" y1="629" x2="1384" y2="629" stroke="#F1F5F9"/>

    <circle cx="322" cy="654" r="8" fill="#DCFCE7"/>
    <path d="M318 654l3 3 5-6" fill="none" stroke="#166534" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="342" y="658" fill="#0F172A" font-weight="600">Schema de destino compatível e sem registros</text>
    <text x="1150" y="658" fill="#166534" font-weight="650">Aprovado</text>
    <line x1="310" y1="672" x2="1384" y2="672" stroke="#F1F5F9"/>

    <circle cx="322" cy="697" r="8" fill="#DCFCE7"/>
    <path d="M318 697l3 3 5-6" fill="none" stroke="#166534" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="342" y="701" fill="#0F172A" font-weight="600">Estimativa de 1.284 registros · nenhum dado pessoal será exibido</text>
    <text x="1150" y="701" fill="#166534" font-weight="650">Aprovado</text>
  </g>

  <rect x="286" y="739" width="1122" height="207" rx="10" fill="#FFFFFF" stroke="#DCE3EC"/>
  <text x="310" y="773" class="card-title">Execução</text>
  <rect x="1214" y="753" width="170" height="26" rx="13" fill="#F1F5F9"/>
  <circle cx="1229" cy="766" r="4" fill="#64748B"/>
  <text x="1241" y="770" fill="#334155" font-size="11" font-weight="650">AGUARDANDO INÍCIO</text>
  <text x="310" y="804" class="muted body">A cópia será executada em segundo plano. Esta página poderá ser fechada durante o processamento.</text>
  <rect x="310" y="826" width="1074" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="310" y="826" width="0" height="8" rx="4" fill="#1D4ED8"/>
  <text x="310" y="855" fill="#64748B" font-size="12">0 de 27 tabelas</text>
  <text x="1384" y="855" text-anchor="end" fill="#64748B" font-size="12">0 de 1.284 registros</text>
  <rect x="310" y="875" width="18" height="18" rx="3" fill="#1D4ED8"/>
  <path d="M314 884l4 4 7-8" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="340" y="889" fill="#334155" font-size="12">Confirmo que revisei a origem e o destino vazio e autorizo copiar os dados.</text>
  <rect x="1195" y="866" width="189" height="42" rx="8" fill="#1D4ED8"/>
  <text x="1289" y="892" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="650">Revisar e iniciar</text>

  <rect x="286" y="966" width="1122" height="58" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
  <circle cx="310" cy="995" r="9" fill="#DBEAFE"/>
  <text x="310" y="999" text-anchor="middle" fill="#1E40AF" font-size="12" font-weight="700">i</text>
  <text x="329" y="991" fill="#1E3A8A" font-size="12" font-weight="650">A migração copia os dados; não altera o arquivo SQLite nem troca a configuração ativa do sistema.</text>
  <text x="329" y="1009" fill="#1E40AF" font-size="11">A ativação do MySQL continua sendo uma etapa separada de implantação e validação.</text>
</svg>
