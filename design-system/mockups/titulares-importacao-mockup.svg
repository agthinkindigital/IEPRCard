<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2040" viewBox="0 0 1440 2040" role="img" aria-labelledby="title description">
  <title id="title">Titulares: consulta, cadastro e importação</title>
  <desc id="description">Proposta para consulta, cadastro individual e importação com staging cifrado por linha, vínculos de titular e prévia fictícia.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/></filter>
    <style>
      text { font-family: Inter, system-ui, "Segoe UI", sans-serif; }
      .muted { fill: #475569; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: .4px; }
      .title { font-size: 25px; font-weight: 700; fill: #0F172A; }
      .card { fill: #FFFFFF; stroke: #DCE3EC; }
      .line { stroke: #DCE3EC; }
      .input { fill: #FFFFFF; stroke: #94A3B8; }
    </style>
  </defs>
  <rect width="1440" height="1900" fill="#F6F8FB"/>

