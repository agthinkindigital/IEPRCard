  <text x="850" y="430" class="small" font-weight="700" fill="#0F172A">CPF</text>
  <rect x="850" y="442" width="244" height="38" rx="6" class="input"/>
  <text x="1110" y="430" class="small" font-weight="700" fill="#0F172A">Matrícula</text>
  <rect x="1110" y="442" width="250" height="38" rx="6" class="input"/>
  <text x="850" y="510" class="small" font-weight="700" fill="#0F172A">Cargo ou função</text>
  <rect x="850" y="522" width="244" height="38" rx="6" class="input"/>
  <text x="1110" y="510" class="small" font-weight="700" fill="#0F172A">Categoria</text>
  <rect x="1110" y="522" width="250" height="38" rx="6" class="input"/>
  <text x="1128" y="546" class="small muted">Selecionar categoria</text>
  <text x="850" y="590" class="small" font-weight="700" fill="#0F172A">WhatsApp</text>
  <rect x="850" y="602" width="244" height="38" rx="6" class="input"/>
  <rect x="850" y="662" width="510" height="48" rx="7" fill="#EFF6FF"/>
  <text x="868" y="683" class="small" font-weight="600" fill="#1E40AF">O cadastro individual não envia foto.</text>
  <text x="868" y="701" class="small" fill="#1E40AF">Para fotos, use o ZIP opcional na importação em lote.</text>
  <rect x="1090" y="760" width="112" height="40" rx="7" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="1146" y="785" text-anchor="middle" class="small" font-weight="600" fill="#0F172A">Cancelar</text>
  <rect x="1212" y="760" width="148" height="40" rx="7" fill="#1D4ED8"/>
  <text x="1286" y="785" text-anchor="middle" class="small" font-weight="700" fill="#FFFFFF">Salvar titular</text>

  <!-- Import wizard -->
  <text x="40" y="928" font-size="13" font-weight="700" fill="#475569">2 · IMPORTAÇÃO EM LOTE — ARQUIVO REVISADO E COLUNAS MAPEADAS</text>
  <rect x="24" y="948" width="1392" height="1050" rx="12" fill="#FFFFFF" stroke="#DCE3EC" filter="url(#shadow)"/>
  <rect x="24" y="948" width="220" height="1050" rx="12" fill="#FFFFFF"/>
