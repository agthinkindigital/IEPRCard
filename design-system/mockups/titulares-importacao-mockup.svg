  <rect x="44" y="970" width="34" height="34" rx="8" fill="#1D4ED8"/>
  <path d="M52 987h18M61 978v18" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="88" y="986" font-size="16" font-weight="700" fill="#0F172A">IEPRCard</text>
  <text x="88" y="1001" font-size="10" fill="#475569">ÁREA DA SEDE</text>
  <text x="58" y="1055" class="body muted">Titulares</text>
  <rect x="38" y="1070" width="190" height="40" rx="7" fill="#EFF6FF"/>
  <rect x="38" y="1070" width="3" height="40" rx="2" fill="#1D4ED8"/>
  <text x="58" y="1095" font-size="13" font-weight="700" fill="#1D4ED8">Importações</text>
  <text x="58" y="1140" class="body muted">Designs</text>
  <text x="58" y="1184" class="body muted">Lotes</text>
  <rect x="244" y="948" width="1172" height="58" fill="#FFFFFF"/>
  <path d="M244 1006h1172" class="line"/>
  <text x="276" y="983" class="body muted">Painel / Titulares / Importar</text>
  <text x="276" y="1052" class="title">Importar titulares</text>
  <text x="276" y="1076" class="body muted">Revise o arquivo e associe cada coluna ao campo correspondente.</text>

  <g>
    <circle cx="300" cy="1120" r="15" fill="#166534"/><text x="300" y="1125" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
    <text x="326" y="1125" class="small" font-weight="700" fill="#166534">Arquivo</text>
    <path d="M390 1120h105" stroke="#166534" stroke-width="2"/>
    <circle cx="515" cy="1120" r="15" fill="#1D4ED8"/><text x="515" y="1125" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
    <text x="541" y="1125" class="small" font-weight="700" fill="#1D4ED8">Mapeamento</text>
    <path d="M642 1120h130" class="line" stroke-width="2"/>
    <circle cx="792" cy="1120" r="15" fill="#E2E8F0"/><text x="792" y="1125" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">3</text>
    <text x="818" y="1125" class="small muted">Vínculos</text>
    <path d="M886 1120h165" class="line" stroke-width="2"/>
    <circle cx="1071" cy="1120" r="15" fill="#E2E8F0"/><text x="1071" y="1125" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">4</text>
    <text x="1097" y="1125" class="small muted">Confirmar</text>
  </g>

  <rect x="276" y="1152" width="1110" height="74" rx="8" fill="#F8FAFC" stroke="#DCE3EC"/>
  <rect x="296" y="1171" width="34" height="38" rx="5" fill="#DCFCE7"/>
  <text x="313" y="1195" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">XLSX</text>
  <text x="344" y="1182" class="body" font-weight="700" fill="#0F172A">membros_2026.xlsx</text>
  <text x="344" y="1205" class="small muted">248 registros · 5 colunas · escopo: Sede Exemplo</text>
  <text x="1298" y="1195" class="small" font-weight="600" fill="#166534">Arquivo armazenado em área privada</text>

  <rect x="276" y="1244" width="1110" height="92" rx="8" fill="#FFFFFF" stroke="#DCE3EC"/>
  <text x="296" y="1274" class="body" font-weight="700" fill="#0F172A">Fotos (opcional)</text>
  <text x="296" y="1298" class="small muted">ZIP com arquivos no nível raiz; cada nome deve corresponder ao CPF ou matrícula do titular.</text>
  <rect x="296" y="1308" width="164" height="28" rx="5" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="378" y="1327" text-anchor="middle" class="small" fill="#0F172A">Anexar ZIP</text>
  <text x="474" y="1327" class="small muted">Aceita JPG, JPEG, PNG ou WebP; até 500 fotos e 10 MB por arquivo compactado.</text>

  <text x="276" y="1370" class="body" font-weight="700" fill="#0F172A">Mapeamento de colunas</text>
  <text x="276" y="1393" class="small muted">O nome é obrigatório. Cada campo pode ser usado uma vez.</text>
  <rect x="276" y="1410" width="1110" height="52" rx="6" fill="#F8FAFC"/>
  <text x="296" y="1442" class="small" font-weight="700" fill="#475569">COLUNA NO ARQUIVO</text>
  <text x="770" y="1442" class="small" font-weight="700" fill="#475569">CAMPO DO TITULAR</text>
  <g class="small">
    <text x="296" y="1500" fill="#0F172A">Nome do membro</text><text x="770" y="1500" fill="#0F172A">Nome completo *</text>
    <text x="296" y="1550" fill="#0F172A">Documento</text><text x="770" y="1550" fill="#0F172A">CPF</text>
    <text x="296" y="1600" fill="#0F172A">Código</text><text x="770" y="1600" fill="#0F172A">Matrícula</text>
    <text x="296" y="1650" fill="#0F172A">Celular</text><text x="770" y="1650" fill="#0F172A">WhatsApp</text>
  </g>
  <g>
    <rect x="730" y="1474" width="620" height="36" rx="6" class="input"/><rect x="730" y="1524" width="620" height="36" rx="6" class="input"/>
    <rect x="730" y="1574" width="620" height="36" rx="6" class="input"/><rect x="730" y="1624" width="620" height="36" rx="6" class="input"/>
    <text x="748" y="1498" class="small" fill="#0F172A">Nome completo *</text><text x="748" y="1548" class="small" fill="#0F172A">CPF</text>
    <text x="748" y="1598" class="small" fill="#0F172A">Matrícula</text><text x="748" y="1648" class="small" fill="#0F172A">WhatsApp</text>
  </g>
  <rect x="276" y="1680" width="1110" height="112" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="296" y="1707" class="body" font-weight="700" fill="#1E3A8A">Vínculo e proteção por linha</text>
  <text x="296" y="1732" class="small" fill="#1E40AF">248 linhas · 248 sujeitos provisórios · 0 pendências · fotos associadas pela linha correspondente</text>
  <text x="296" y="1754" class="small muted">Cada linha e suas fotos ficam cifradas separadamente até confirmar, cancelar ou expirar o lote.</text>
  <text x="296" y="1776" class="small muted">Arquivo original e ZIP são removidos após extração; valores de todas as colunas permanecem no staging cifrado.</text>

  <rect x="276" y="1804" width="1110" height="82" rx="8" fill="#FFFFFF" stroke="#DCE3EC"/>
  <text x="296" y="1832" class="body" font-weight="700" fill="#0F172A">Prévia fictícia: 4 de 248 registros</text>
  <text x="296" y="1857" class="small muted">A confirmação valida o lote inteiro; erro, ambiguidade ou cota insuficiente rejeita todos os registros.</text>
  <rect x="1000" y="1902" width="148" height="42" rx="7" fill="#FFFFFF" stroke="#94A3B8"/>
  <text x="1074" y="1928" text-anchor="middle" class="small" font-weight="600" fill="#0F172A">Cancelar lote</text>
  <rect x="1160" y="1902" width="226" height="42" rx="7" fill="#1D4ED8"/>
  <text x="1273" y="1928" text-anchor="middle" class="small" font-weight="700" fill="#FFFFFF">Revisar vínculos</text>
  <text x="276" y="1968" class="small" fill="#92400E">Proposta para aprovação · estágio por linha e vínculo ao titular ainda não implementados.</text>
</svg>
