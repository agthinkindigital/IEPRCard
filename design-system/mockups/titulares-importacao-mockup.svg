  <!-- Cadastro individual drawer -->
  <rect x="824" y="244" width="562" height="594" rx="10" fill="#FFFFFF" stroke="#DCE3EC" filter="url(#shadow)"/>
  <text x="850" y="280" font-size="18" font-weight="700" fill="#0F172A">Novo titular</text>
  <text x="850" y="303" class="small muted">O cadastro é criado na unidade do escopo selecionado.</text>
  <path d="M850 319h510" class="line"/>
  <text x="850" y="350" class="small" font-weight="700" fill="#0F172A">Nome completo *</text>
  <rect x="850" y="362" width="510" height="38" rx="6" class="input"/>
