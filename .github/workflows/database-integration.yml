name: Database integration

on:
  push:
    branches: [DEV]
  pull_request:
    branches: [PROD]

permissions:
  contents: read

jobs:
  php-database-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database-image: ['mysql:8.4', 'mariadb:10.11']
    services:
      mysql:
        image: ${{ matrix.database-image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: ieprcard_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, pdo_mysql, zip

      - name: Wait for database service
        run: |
          for attempt in $(seq 1 30); do
            if php -r '$pdo = new PDO("mysql:host=127.0.0.1;port=3306;dbname=ieprcard_test;charset=utf8mb4", "root", "root");' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Database service did not become ready."
          exit 1

      - name: Run integration tests
        run: php tests/run_all.php
        env:
          CI: 'true'
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: '3306'
          TEST_MYSQL_DATABASE: ieprcard_test
          TEST_MYSQL_USERNAME: root
          TEST_MYSQL_PASSWORD: root
